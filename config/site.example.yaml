# Private host choices. Replace example paths and address before installation.
schema_version: 1
composition: rgbd-demo
platform: orin-nx-jp721
robot_id: car-02
runtime_account: robot
storage:
  installation_root: /opt/robot
  data_root: /var/lib/robot
network:
  hostname: car-02
  media_address: 192.0.2.22
  media_udp_port: 8860
  web_host: 0.0.0.0
  web_port: 8443
ros: {namespace: perception, domain_id: 30}
runtime_namespace: robot
hardware:
  front_camera:
    variant: oak_d_rvc2
    # Usually absent: discover exactly one compatible camera at each Start.
    # device_ids: {oak_d_rvc2: EXACT_SESSION_ID}
camera_profiles: {oak: oak-720p30, d455: d455-720p30}
# Install VO/VIO capabilities during maintenance; every runtime default stays Off.
# Select docker (default) or native here, then stage a new release.
visual_odometry: {enabled: false, backend: docker}
recording:
  budget_bytes: 10000000000
  reserve_bytes: 1000000000
  segment_seconds: 30
  # Default directory is storage.data_root/recordings. Depth is a visualization.
  min_depth_m: 0.25
  max_depth_m: 15.0
  bitrates: {rgb: 6000000, annotated: 6000000, depth: 4000000}
workspaces: {student: /home/robot/student_ws}
credentials:
  web_secret_file: /etc/robot_deployment/secrets/web-secret
  tls_certificate_file: /etc/robot_deployment/tls/certificate.pem
  tls_private_key_file: /etc/robot_deployment/tls/private-key.pem
management: {start: false}
shell: {alias: false}
